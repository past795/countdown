name: LINE 離職倒數提醒

on:
  schedule:
    # UTC 01:00 = 台灣時間早上 09:00
    - cron: "0 1 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-line-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 傳送 LINE 離職倒數
        uses: actions/github-script@v7
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          LINE_FRIEND_USER_ID: ${{ secrets.LINE_FRIEND_USER_ID }}

        with:
          script: |
            const token =
              process.env.LINE_CHANNEL_ACCESS_TOKEN;

            const recipients = [
              process.env.LINE_USER_ID,
              process.env.LINE_FRIEND_USER_ID
            ].filter(Boolean);

            if (!token) {
              throw new Error(
                "找不到 LINE_CHANNEL_ACCESS_TOKEN"
              );
            }

            if (recipients.length !== 2) {
              throw new Error(
                "找不到 LINE_USER_ID 或 LINE_FRIEND_USER_ID"
              );
            }

            // 台灣時間 2027/3/5 下午 6 點
            const targetTime =
              new Date("2027-03-05T18:00:00+08:00").getTime();

            const remaining = targetTime - Date.now();

            if (remaining <= 0) {
              core.notice("離職時間已到，停止傳送提醒。");
              return;
            }

            const days =
              Math.floor(remaining / 86400000);

            const hours =
              Math.floor(
                (remaining % 86400000) / 3600000
              );

            const minutes =
              Math.floor(
                (remaining % 3600000) / 60000
              );

            const websiteUrl =
              "https://blue-freedom-day-2027.pages.dev/?v=20270305";

            const message = [
              "🕊️ 離職倒數",
              "",
              "距離 2027/3/5 下午 6:00",
              `還有 ${days} 天 ${hours} 小時 ${minutes} 分鐘！`,
              "",
              "每天都離自由更近一點 💙",
              websiteUrl
            ].join("\n");

            for (const userId of recipients) {
              const response = await fetch(
                "https://api.line.me/v2/bot/message/push",
                {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                  },
                  body: JSON.stringify({
                    to: userId,
                    messages: [
                      {
                        type: "text",
                        text: message
                      }
                    ]
                  })
                }
              );

              const responseText =
                await response.text();

              if (!response.ok) {
                throw new Error(
                  `LINE 傳送失敗：HTTP ${response.status} ${responseText}`
                );
              }
            }

            core.notice(
              `已成功傳送給 ${recipients.length} 位接收者`
            );
