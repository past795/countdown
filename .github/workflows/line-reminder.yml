name: LINE 離職倒數提醒

on:
  schedule:
    # GitHub 排程使用 UTC
    # UTC 01:00 = 台灣時間 09:00
    - cron: "0 1 * * *"

  # 允許從 GitHub Actions 頁面手動測試
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-line-reminder:
    runs-on: ubuntu-latest

    steps:
      - name: 傳送 LINE 離職倒數
        uses: actions/github-script@v7
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}

        with:
          script: |
            const token = process.env.LINE_CHANNEL_ACCESS_TOKEN;
            const userId = process.env.LINE_USER_ID;

            if (!token) {
              throw new Error(
                "找不到 GitHub Secret：LINE_CHANNEL_ACCESS_TOKEN"
              );
            }

            if (!userId) {
              throw new Error(
                "找不到 GitHub Secret：LINE_USER_ID"
              );
            }

            // 正式離職：台灣時間 2027/2/3 下午 6 點
            const targetTime =
              new Date("2027-02-03T18:00:00+08:00").getTime();

            const now = Date.now();
            const remaining = targetTime - now;

            // 離職時間已過就停止傳送
            if (remaining <= 0) {
              core.notice("離職時間已到，停止傳送倒數提醒。");
              return;
            }

            const days =
              Math.floor(remaining / 86400000);

            const hours =
              Math.floor((remaining % 86400000) / 3600000);

            const minutes =
              Math.floor((remaining % 3600000) / 60000);

            const message = [
              "🕊️ 離職倒數",
              "",
              "距離 2027/2/3 下午 6:00",
              `還有 ${days} 天 ${hours} 小時 ${minutes} 分鐘！`,
              "",
              "每天都離自由更近一點 💙",
              "https://blue-freedom-day-2027.pages.dev/"
            ].join("\n");

            const response = await fetch(
              "https://api.line.me/v2/bot/message/push",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({
                  to: userId,
                  messages: [
                    {
                      type: "text",
                      text: message
                    }
                  ]
                })
              }
            );

            const responseText = await response.text();

            if (!response.ok) {
              throw new Error(
                `LINE 傳送失敗：HTTP ${response.status} ${responseText}`
              );
            }

            core.notice("LINE 離職倒數提醒傳送成功！");
